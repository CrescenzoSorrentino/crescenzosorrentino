<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tamagotchi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A2342"/>
      <stop offset="1" stop-color="#1A3A6E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Soft accent glow -->
  <circle cx="1040" cy="140" r="320" fill="#8BAC0F" opacity="0.08"/>
  <circle cx="200" cy="640" r="260" fill="#7AAEE8" opacity="0.06"/>

  <!-- Handheld console with a green LCD screen (Game Boy aesthetic) -->
  <g transform="translate(760,110)">
    <!-- console shell -->
    <rect x="0" y="0" width="380" height="500" rx="40" fill="#12294B" stroke="#3A5478" stroke-width="3"/>

    <!-- LCD bezel + screen -->
    <rect x="46" y="42" width="288" height="240" rx="16" fill="#0A1C33"/>
    <rect x="70" y="66" width="240" height="192" rx="8" fill="#9BBC0F"/>

    <!-- pixel-art pet on the LCD (monochrome green palette), drawn on a 8px grid -->
    <g transform="translate(118,110)" fill="#0F380F">
      <!-- body -->
      <rect x="24" y="16" width="16" height="8"/>
      <rect x="72" y="16" width="16" height="8"/>
      <rect x="16" y="24" width="80" height="8"/>
      <rect x="8"  y="32" width="96" height="40"/>
      <rect x="16" y="72" width="80" height="8"/>
      <!-- eyes (LCD shows through) -->
      <rect x="32" y="40" width="12" height="12" fill="#9BBC0F"/>
      <rect x="68" y="40" width="12" height="12" fill="#9BBC0F"/>
      <!-- feet -->
      <rect x="24" y="80" width="16" height="10"/>
      <rect x="72" y="80" width="16" height="10"/>
    </g>

    <!-- stat bar under the sprite -->
    <rect x="94" y="228" width="192" height="12" rx="6" fill="#0F380F" opacity="0.25"/>
    <rect x="94" y="228" width="120" height="12" rx="6" fill="#306230"/>

    <!-- D-pad -->
    <g transform="translate(78,330)" fill="#0A1C33">
      <rect x="26" y="0"  width="24" height="76" rx="6"/>
      <rect x="0"  y="26" width="76" height="24" rx="6"/>
    </g>

    <!-- A / B buttons -->
    <circle cx="288" cy="360" r="26" fill="#8BAC0F"/>
    <circle cx="240" cy="392" r="26" fill="#8BAC0F"/>

    <!-- speaker grille -->
    <g fill="#0A1C33" opacity="0.6">
      <rect x="250" y="452" width="60" height="6" rx="3"/>
      <rect x="250" y="464" width="60" height="6" rx="3"/>
      <rect x="250" y="476" width="60" height="6" rx="3"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="120" y="300" font-family="'DM Sans', Arial, sans-serif" font-size="46" font-weight="500" letter-spacing="6" fill="#9CC4F0">VIRTUAL PET</text>
  <!-- textLength blocca la larghezza a 600px: l'SVG come <img> non carica web font e
       ricade su un serif di sistema (più largo), quindi senza questo "tamagotchi" sforerebbe -->
  <text x="120" y="450" textLength="600" lengthAdjust="spacingAndGlyphs" font-family="'Cormorant Garamond', Georgia, serif" font-size="120" font-weight="600" fill="#FAF9F7">tamagotchi</text>
  <rect x="124" y="480" width="200" height="6" rx="3" fill="#8BAC0F"/>
</svg>
